<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#D83200"/>
    </linearGradient>
    <linearGradient id="crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58A2D"/>
      <stop offset="100%" stop-color="#B75300"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDA44"/>
      <stop offset="100%" stop-color="#FFA100"/>
    </linearGradient>
    <linearGradient id="pepperoni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D63031"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Rounded Badge Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Pizza Slice with 3D Depth & Steam -->
  <g filter="url(#drop)">
    <!-- Crust Arc Base -->
    <path d="M12 21 Q32 11 52 21 L32 55 Z" fill="url(#crust)"/>
    
    <!-- Crunchy Crust Top Lip -->
    <path d="M10 20 Q32 9 54 20 Q32 14 10 20 Z" fill="#9C4400"/>

    <!-- Golden Bubbly Cheese Layer -->
    <path d="M13.5 23.5 Q32 15 50.5 23.5 L32 53 Z" fill="url(#cheese)"/>

    <!-- Pepperoni Slices -->
    <circle cx="26" cy="30" r="4.5" fill="url(#pepperoni)"/>
    <circle cx="37" cy="32" r="4.2" fill="url(#pepperoni)"/>
    <circle cx="32" cy="42" r="3.6" fill="url(#pepperoni)"/>
    
    <!-- Pepperoni Highlights -->
    <circle cx="27.5" cy="28.5" r="1.3" fill="#FF7675" opacity="0.8"/>
    <circle cx="38.5" cy="30.5" r="1.2" fill="#FF7675" opacity="0.8"/>
    <circle cx="33.2" cy="40.8" r="1" fill="#FF7675" opacity="0.8"/>

    <!-- Fresh Basil Leaves -->
    <path d="M30 24 C29 21.5 32.5 19.5 34.5 21.5 C34.5 23.5 31.5 25 30 24 Z" fill="#10B981"/>
    <path d="M22 38 C20 37 22 34 24 35 C25 37 23 39 22 38 Z" fill="#10B981"/>
    <path d="M40 40 C42 39 43 41 41 42.5 C39 42.5 39 41 40 40 Z" fill="#10B981"/>

    <!-- Steam Waves (Hot & Fresh) -->
    <path d="M24 13 Q26 9 24 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M32 12 Q34 8 32 5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M40 13 Q42 9 40 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
